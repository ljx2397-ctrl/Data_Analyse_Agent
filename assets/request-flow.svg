<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="440" rx="18" fill="#f6f9fd"/>

  <text x="40" y="52" font-size="24" font-weight="700" fill="#16335c">一次提问的完整链路（SSE 流式）</text>
  <text x="40" y="78" font-size="13.5" fill="#6a7c99">从用户输入到前端实时渲染的端到端处理流程</text>

  <!-- 主链路：六个节点 -->
  <g font-size="13.5">
    <!-- 1. 用户提问 -->
    <rect x="40" y="130" width="150" height="100" rx="12" fill="#eaf3ff" stroke="#9ec5f5" stroke-width="1.5"/>
    <text x="115" y="170" font-weight="700" fill="#1d4e9e" text-anchor="middle">💬 用户提问</text>
    <text x="115" y="196" font-size="11" fill="#5a7396" text-anchor="middle">自然语言 + 数据文件</text>

    <!-- 2. RAG 预处理 -->
    <rect x="220" y="130" width="150" height="100" rx="12" fill="#fef0f0" stroke="#f5b8b8" stroke-width="1.5"/>
    <text x="295" y="162" font-weight="700" fill="#9e2b2b" text-anchor="middle">🔍 RAG 预处理</text>
    <text x="295" y="186" font-size="11" fill="#7a5a5a" text-anchor="middle">列名匹配 / 术语查询</text>
    <text x="295" y="204" font-size="11" fill="#7a5a5a" text-anchor="middle">正常则跳过</text>

    <!-- 3. 智能路由 -->
    <rect x="400" y="130" width="150" height="100" rx="12" fill="#fff7e8" stroke="#f0cd8a" stroke-width="1.5"/>
    <text x="475" y="170" font-weight="700" fill="#8a5a12" text-anchor="middle">🧭 智能路由</text>
    <text x="475" y="196" font-size="11" fill="#9a7b3a" text-anchor="middle">规则 + LLM 分类</text>

    <!-- 4. Agent 执行 -->
    <rect x="580" y="130" width="150" height="100" rx="12" fill="#eafaf0" stroke="#9ed8b4" stroke-width="1.5"/>
    <text x="655" y="162" font-weight="700" fill="#1e7d3c" text-anchor="middle">🤖 Agent 执行</text>
    <text x="655" y="186" font-size="11" fill="#4d7a5f" text-anchor="middle">ReAct 或</text>
    <text x="655" y="206" font-size="11" fill="#4d7a5f" text-anchor="middle">Plan-Execute-Replan</text>

    <!-- 5. SSE 推送 -->
    <rect x="760" y="130" width="150" height="100" rx="12" fill="#f1ebfd" stroke="#c4b0ec" stroke-width="1.5"/>
    <text x="835" y="170" font-weight="700" fill="#553098" text-anchor="middle">🌊 SSE 流式推送</text>
    <text x="835" y="196" font-size="11" fill="#7a63b0" text-anchor="middle">token / 事件 / 图表</text>

    <!-- 6. 前端渲染 -->
    <rect x="940" y="130" width="150" height="100" rx="12" fill="#eaf3ff" stroke="#9ec5f5" stroke-width="1.5"/>
    <text x="1015" y="170" font-weight="700" fill="#1d4e9e" text-anchor="middle">🖥️ 前端渲染</text>
    <text x="1015" y="196" font-size="11" fill="#5a7396" text-anchor="middle">Markdown / 图表 / 下载</text>
  </g>

  <!-- 连接箭头 -->
  <line x1="190" y1="180" x2="216" y2="180" stroke="#5b7fb5" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="370" y1="180" x2="396" y2="180" stroke="#5b7fb5" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="550" y1="180" x2="576" y2="180" stroke="#5b7fb5" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="730" y1="180" x2="756" y2="180" stroke="#5b7fb5" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="910" y1="180" x2="936" y2="180" stroke="#5b7fb5" stroke-width="2" marker-end="url(#ar3)"/>

  <!-- RAG 预处理子流程 -->
  <rect x="130" y="290" width="240" height="110" rx="12" fill="#ffffff" stroke="#e8b8b8" stroke-width="1.5"/>
  <text x="250" y="316" font-size="12.5" font-weight="700" fill="#9e2b2b" text-anchor="middle">🔍 RAG 预处理路径</text>
  <text x="250" y="338" font-size="11.5" fill="#7a5a5a" text-anchor="middle">列名异常 → 检索知识库 → 匹配表头</text>
  <text x="250" y="358" font-size="11.5" fill="#7a5a5a" text-anchor="middle">术语查询 → 检索知识库 → 直接回答</text>
  <text x="250" y="378" font-size="11.5" fill="#7a5a5a" text-anchor="middle">列名正常 + 分析任务 → 跳过</text>
  <line x1="295" y1="230" x2="295" y2="286" stroke="#d49b9b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar3)"/>

  <!-- 路由决策子流程 -->
  <rect x="400" y="290" width="220" height="110" rx="12" fill="#ffffff" stroke="#c9d7ef" stroke-width="1.5"/>
  <text x="510" y="316" font-size="12.5" font-weight="700" fill="#46618a" text-anchor="middle">🧭 路由决策规则</text>
  <text x="510" y="338" font-size="11.5" fill="#5a7396" text-anchor="middle">复杂度 ≤ 4 → ReAct</text>
  <text x="510" y="358" font-size="11.5" fill="#5a7396" text-anchor="middle">≥ 8 且步骤 ≥ 4 → Plan</text>
  <text x="510" y="378" font-size="11.5" fill="#5a7396" text-anchor="middle">连续失败 ≥ 3 → 降级 ReAct</text>
  <line x1="475" y1="230" x2="475" y2="286" stroke="#5b7fb5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar3)"/>

  <!-- Agent 工具调用子流程 -->
  <rect x="650" y="290" width="380" height="110" rx="12" fill="#ffffff" stroke="#c9d7ef" stroke-width="1.5"/>
  <text x="840" y="316" font-size="12.5" font-weight="700" fill="#46618a" text-anchor="middle">🛠️ 执行期间按需调用工具</text>
  <g font-size="11.5" fill="#2b4a77">
    <rect x="680" y="330" width="80" height="26" rx="13" fill="#f4f8ff" stroke="#b9d0ee"/>
    <text x="720" y="347" text-anchor="middle">🔍 Schema</text>
    <rect x="775" y="330" width="80" height="26" rx="13" fill="#f4f8ff" stroke="#b9d0ee"/>
    <text x="815" y="347" text-anchor="middle">📈 Analyse</text>
    <rect x="870" y="330" width="80" height="26" rx="13" fill="#f4f8ff" stroke="#b9d0ee"/>
    <text x="910" y="347" text-anchor="middle">📊 Chart</text>
    <rect x="965" y="330" width="80" height="26" rx="13" fill="#f4f8ff" stroke="#b9d0ee"/>
    <text x="1005" y="347" text-anchor="middle">📑 Excel</text>
  </g>
  <text x="840" y="383" font-size="11" fill="#7a8ba3" text-anchor="middle">沙箱执行 · AST 安全检查 · 超时保护</text>
  <line x1="655" y1="230" x2="655" y2="286" stroke="#5b7fb5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar3)"/>
</svg>
